name: ${COMPOSE_PROJECT_NAME:-eacbot-podman}
services:
  omb:
    build:
      context: ../..
      dockerfile: deploy/podman/Containerfile
      args:
        ENGINES: ${ENGINES:-}
    image: localhost/eacbot-podman:${EAC_IMAGE_TAG:-local}
    # Collects exited browser processes; Chrome's shared memory as on the
    # desktop containers (docs/browser-packaging.md, "Process hygiene").
    init: true
    shm_size: 512m
    userns_mode: keep-id:uid=1001,gid=1001
    user: "1001:1001"
    restart: unless-stopped
    # On Windows this is the Linux Podman machine. The app must reach the
    # dynamically allocated, loopback-only desktop ports on that same host.
    network_mode: host
    volumes:
      - ${EAC_DATA_ROOT:?Run setup.sh first}:${EAC_DATA_ROOT}
      - ${PODMAN_SOCKET:?Run setup.sh first}:/run/omb-podman.sock
    environment:
      HOME: ${EAC_DATA_ROOT}
      EAC_DATA_DIR: ${EAC_DATA_ROOT}/.eacbot
      EAC_STATIC_DIR: /app/dist
      CONTAINER_HOST: unix:///run/omb-podman.sock
      EAC_PORT: ${EAC_PORT:-8799}
      EAC_WEBHOOK_PORT: ${EAC_WEBHOOK_PORT:-8800}
      EAC_PUBLIC_URL: ${EAC_PUBLIC_URL:-http://localhost:8080}
      EAC_WEBHOOK_PUBLIC_URL: ${EAC_PUBLIC_URL:-http://localhost:8080}
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:$$EAC_PORT/api/health | grep -q eacbot']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  caddy:
    image: docker.io/library/caddy:2.11.4
    restart: unless-stopped
    network_mode: host
    depends_on:
      omb:
        condition: service_healthy
    environment:
      EAC_HTTP_PORT: ${EAC_HTTP_PORT:-8080}
      EAC_PORT: ${EAC_PORT:-8799}
      EAC_WEBHOOK_PORT: ${EAC_WEBHOOK_PORT:-8800}
      EAC_HTTPS_HOST: ${EAC_HTTPS_HOST:-https-disabled.invalid}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
