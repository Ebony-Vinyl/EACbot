[package]
name = "eacbot-tauri"
version = "0.1.0"
edition = "2021"
description = "EACbot desktop shell (Tauri): window, tray, system credentials and the supervised local Node service."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
eac-host-contract = { path = "../contract" }
keyring = "3"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "eacbot_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "eacbot-tauri"
path = "src/main.rs"
